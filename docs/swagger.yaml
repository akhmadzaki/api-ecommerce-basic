basePath: /api/v1
definitions:
  handler.HealthResponse:
    properties:
      api_status:
        example: healthy
        type: string
      db_status:
        example: connected
        type: string
      timestamp:
        example: "2026-10-19T15:12:00Z"
        type: string
    type: object
  model.LoginRequest:
    properties:
      email:
        example: test@mail.com
        type: string
      password:
        example: password123
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  model.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJyb2xlIjoiY3VzdG9tZXIiLCJleHAiOjE3OTIzOTk2NzMsImlhdCI6MTc5MjM5ODc3M30.ivu-dP4TLb4x1Oyt5MefFsWwrKZYwGN2GT_vJEqCAXY
        type: string
      message:
        example: Login successful
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJ0b2tlbl9pZCI6IjA0MjBiM2Q5LTgzOWYtNDcyMC04Njk5LTljOWZhNmU0MjY5YyIsImV4cCI6MTc5MzAwMzU3MywiaWF0IjoxNzkyMzk4NzczfQ.3ImJmyp91EfoRXcvygvB-J1BFzUxfkRze3wyoQUJFqA
        type: string
      user_id:
        example: 1
        type: integer
    type: object
  model.RegisterRequest:
    properties:
      email:
        example: test@mail.com
        type: string
      first_name:
        example: FirstName
        type: string
      last_name:
        example: LastName
        type: string
      password:
        example: password123
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  model.RegisterResponse:
    properties:
      message:
        example: User created
        type: string
      user_id:
        example: 1
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Core services for the e-commerce platform. Handles user authentication
    (JWT), dynamic product inventories, order lifecycles, and secure transaction tracking.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go E-Commerce REST API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: User login with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.LoginResponse'
      summary: User login
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register new user with email, password, first name, and last name
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RegisterResponse'
      summary: Register user
  /health:
    get:
      description: Responds with API health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Check API health
swagger: "2.0"
