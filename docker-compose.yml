services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: go_backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy # Waits for pg_isready to pass

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge