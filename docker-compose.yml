services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: appdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: go_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgresuser
      DB_PASSWORD: postgrespassword
      DB_NAME: appdb
      PORT: 8080
      JWT_ACCESS_SECRET: example-access-secret
      JWT_REFRESH_SECRET: example-refresh-secret
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy # Waits for pg_isready to pass

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge